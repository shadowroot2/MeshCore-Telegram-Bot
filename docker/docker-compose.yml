services:
  meshcore-telegram-bot:
    image: dmtrigub/meshcore-telegram-bot:latest
    container_name: meshcore-telegram-bot
    restart: unless-stopped
    environment:
      # чтобы пережить перезапуск контейнера и не плодить дубликаты вкладок
      TOPICS_FILE: /app/data/topics.json
    volumes:
      # .env и этот файл лежат в одной папке (на Synology: /volume1/docker/meshcore)
      - ./.env:/app/.env:ro
      - ./data:/app/data
