services:
  meshcore-telegram-bot:
    image: dmtrigub/meshcore-telegram-bot:latest
    container_name: meshcore-telegram-bot
    restart: unless-stopped
    volumes:
      # Конфиг — единственный источник секретов; в образ он не попадает.
      - ./.env:/app/.env:ro
      # Папка проекта целиком: data/ внутри неё создастся сама при первом
      # старте (daemon Synology не создаёт отсутствующие bind-источники).
      - .:/app/project
